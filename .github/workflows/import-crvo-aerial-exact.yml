name: Import exact CRVO aerial

on:
  push:
    paths:
      - '.github/workflows/import-crvo-aerial-exact.yml'

permissions:
  contents: write

jobs:
  import-aerial:
    if: github.event.head_commit.message == 'ops: stage exact CRVO aerial import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original aerial image
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://at.adobe.com/m0iiykQzfGDE7LcV' -o public/crvo-lens-aerial-source-hd.jpeg
          test -s public/crvo-lens-aerial-source-hd.jpeg
      - name: Commit original aerial image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/crvo-lens-aerial-source-hd.jpeg
          git diff --cached --quiet && exit 0
          git commit -m 'feat(production): import exact aerial source image'
          git push
