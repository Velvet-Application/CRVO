name: Verify final live UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/verify-ui-final.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Check live UI
        run: |
          cat >check.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            page.on('pageerror',e=>console.log('PAGEERROR',e.message));
            page.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
            const nav=await page.goto('https://kpi-crvo.cyril-gay.workers.dev/?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            console.log('NAV',nav?.status());
            await page.waitForTimeout(6000);
            const state=await page.evaluate(()=>({
              date:document.querySelector('.topbar-date strong')?.textContent,
              freshness:document.querySelector('.freshness small')?.textContent,
              nav:Array.from(document.querySelectorAll('.sidebar nav button')).map(e=>e.textContent?.trim()).filter(Boolean),
              hero:Array.from(document.querySelectorAll('.day-hero-stats strong')).map(e=>e.textContent),
              prod:Array.from(document.querySelectorAll('.performance-board:not(.cumulative-board) .performance-column')).map(e=>[e.querySelector('h3')?.textContent,e.querySelector('.performance-main strong')?.textContent]),
              range:Array.from(document.querySelectorAll('.cumulative-board input[type=date]')).map(e=>e.value),
              live:document.documentElement.dataset.crvoLive||null
            }));
            console.log('STATE',JSON.stringify(state));
            await browser.close();
            const ok=String(state.date||'').includes('13')&&state.nav.some(v=>v.includes('Dashboard de la veille'))&&state.range[0]==='2026-08-01'&&state.range[1]==='2026-08-13'&&state.live==='2026-08-13';
            if(!ok)process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.cjs
