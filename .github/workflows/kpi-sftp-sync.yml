name: KPI CRVO - synchronisation FTP live

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bridge/src/index.mjs"
      - "bridge/src/ftp-factory-production.mjs"
      - "bridge/src/factory-live-sync.mjs"
      - "bridge/package.json"
      - "bridge/package-lock.json"
      - ".github/workflows/kpi-sftp-sync.yml"
  schedule:
    # Source opérationnelle terrain : contrôle toutes les 10 minutes.
    # Un job live reste court et n'attend jamais les traitements historiques lourds.
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: read

concurrency:
  group: kpi-crvo-ftp-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge
    env:
      FTP_HOST: ${{ secrets.FTP_HOST || secrets.SFTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT || secrets.SFTP_PORT }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.SFTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.SFTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || secrets.SFTP_REMOTE_DIR }}
      FTP_SECURE: ${{ vars.FTP_SECURE || 'false' }}
      FTP_FILE_PATTERN: ${{ vars.FTP_FILE_PATTERN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      KPI_SOURCE_ID: dfbb57cc-8771-4e53-b52b-38defa389b64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Archive changed FTP files
        run: npm run sync
      - name: Refresh live Factory and certify previous day
        run: node src/factory-live-sync.mjs
