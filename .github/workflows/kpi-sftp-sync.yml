name: KPI CRVO - synchronisation FTP live

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bridge/src/index.mjs"
      - "bridge/src/ftp-vehicle-state.mjs"
      - "bridge/src/vehicle-location-sync.mjs"
      - "bridge/src/factory-live-sync.mjs"
      - "bridge/src/ftp-factory-production.mjs"
      - "bridge/package.json"
      - "bridge/package-lock.json"
      - ".github/workflows/kpi-sftp-sync.yml"
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: kpi-crvo-ftp-live-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge
    env:
      FTP_HOST: ${{ secrets.FTP_HOST || secrets.SFTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT || secrets.SFTP_PORT }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.SFTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.SFTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || secrets.SFTP_REMOTE_DIR }}
      FTP_SECURE: ${{ vars.FTP_SECURE || 'false' }}
      FTP_FILE_PATTERN: ${{ vars.FTP_FILE_PATTERN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      KPI_SOURCE_ID: dfbb57cc-8771-4e53-b52b-38defa389b64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Archive changed FTP files
        run: npm run sync
      - name: Refresh vehicle physical locations
        run: node src/vehicle-location-sync.mjs
      - name: Refresh live Factory and certify previous day
        run: node src/factory-live-sync.mjs
      - name: Verify hourly industrial freshness contract
        working-directory: .
        run: |
          node <<'NODE'
          const wait=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
          let last={};
          for(let attempt=1;attempt<=4;attempt+=1){
            try{
              const response=await fetch('https://kpi-crvo.cyril-gay.workers.dev/api/health?_='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
              const health=await response.json().catch(()=>({}));
              const syncAge=Number(health?.ftp?.syncAgeMinutes ?? 99999);
              const sourceAge=Number(health?.production?.sourceAgeMinutes ?? 99999);
              last={status:response.status,trust:health?.trustLevel,syncAge,sourceAge,dataReady:health?.dataReady};
              console.log(`freshness attempt=${attempt}/4 health=${response.status} trust=${health?.trustLevel} ftpSyncAge=${syncAge}m sourceAge=${sourceAge}m`);
              if(response.ok && health?.dataReady===true && Number.isFinite(syncAge) && syncAge<=50 && Number.isFinite(sourceAge) && sourceAge<=85)process.exit(0);
            }catch(error){last={error:error instanceof Error?error.message:'unknown'};console.log(`freshness attempt=${attempt}/4 failed: ${last.error}`);}
            if(attempt<4)await wait(5000);
          }
          console.error('hourly industrial freshness contract failed',last);
          process.exit(1);
          NODE

# Forced real sync marker: automation-run-2026-08-22-manual-refresh-F
