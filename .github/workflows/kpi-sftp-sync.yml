name: KPI CRVO - synchronisation FTP live

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bridge/src/index.mjs"
      - "bridge/src/ftp-factory-production.mjs"
      - "bridge/src/factory-live-sync.mjs"
      - "bridge/package.json"
      - "bridge/package-lock.json"
      - ".github/workflows/kpi-sftp-sync.yml"
  schedule:
    # Redondance industrielle : tentative toutes les 5 minutes.
    # GitHub Actions restant best-effort, la fraicheur réelle est surveillée par /api/health.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: kpi-crvo-ftp-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge
    env:
      FTP_HOST: ${{ secrets.FTP_HOST || secrets.SFTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT || secrets.SFTP_PORT }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.SFTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.SFTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || secrets.SFTP_REMOTE_DIR }}
      FTP_SECURE: ${{ vars.FTP_SECURE || 'false' }}
      FTP_FILE_PATTERN: ${{ vars.FTP_FILE_PATTERN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      KPI_SOURCE_ID: dfbb57cc-8771-4e53-b52b-38defa389b64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Archive changed FTP files
        run: npm run sync
      - name: Refresh live Factory and certify previous day
        run: node src/factory-live-sync.mjs
      - name: Verify industrial freshness contract
        working-directory: .
        run: |
          node <<'NODE'
          const response=await fetch('https://kpi-crvo.cyril-gay.workers.dev/api/health?_='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
          const health=await response.json().catch(()=>({}));
          const age=Number(health?.ftp?.syncAgeMinutes ?? 99999);
          console.log(`health=${response.status} trust=${health?.trustLevel} ftpSyncAge=${age}m sourceAge=${health?.production?.sourceAgeMinutes}m`);
          if(!response.ok || health?.dataReady!==true || !Number.isFinite(age) || age>15) process.exit(1);
          NODE
