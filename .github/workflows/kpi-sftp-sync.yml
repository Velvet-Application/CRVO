name: KPI CRVO - synchronisation SFTP

on:
  workflow_dispatch:
  schedule:
    # Plusieurs passages le matin : un fichier déposé après le premier contrôle
    # est repris automatiquement au passage suivant. Les doublons sont ignorés par SHA-256.
    - cron: "30 3,5,7,9 * * 1-5"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run sync
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SFTP_PRIVATE_KEY_PASSPHRASE }}
          SFTP_HOST_FINGERPRINT_SHA256: ${{ secrets.SFTP_HOST_FINGERPRINT_SHA256 }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          SFTP_FILE_PATTERN: ${{ vars.SFTP_FILE_PATTERN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ARCHIVE_BUCKET: ${{ vars.SUPABASE_ARCHIVE_BUCKET }}
          KPI_SOURCE_ID: ${{ vars.KPI_SOURCE_ID }}
