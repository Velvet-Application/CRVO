name: KPI CRVO - synchronisation FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bridge/**"
      - ".github/workflows/kpi-sftp-sync.yml"
  schedule:
    # Lecture opérationnelle légère toutes les 10 minutes.
    - cron: "17,27,37,47,57 * * * *"
    # Une fois par heure, la même lecture est complétée par l'historique lourd
    # (Analyse-Temps-Bruts / LeadTime). Le cron distinct permet de conserver
    # l'intention même si GitHub démarre le job avec quelques minutes de retard.
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: kpi-crvo-ftp-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bridge
    env:
      FTP_HOST: ${{ secrets.FTP_HOST || secrets.SFTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT || secrets.SFTP_PORT }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.SFTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.SFTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || secrets.SFTP_REMOTE_DIR }}
      FTP_SECURE: ${{ vars.FTP_SECURE || 'false' }}
      FTP_FILE_PATTERN: ${{ vars.FTP_FILE_PATTERN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      KPI_SOURCE_ID: dfbb57cc-8771-4e53-b52b-38defa389b64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Archive changed FTP files
        run: npm run sync
      - name: Refresh live Factory and certify previous day
        run: node src/factory-live-sync.mjs
      - name: Refresh deep operational history
        if: github.event_name != 'schedule' || github.event.schedule == '7 * * * *'
        run: node src/operational-live-sync.mjs
      - name: Skip deep history on lightweight poll
        if: github.event_name == 'schedule' && github.event.schedule != '7 * * * *'
        run: echo "Lightweight 10-minute poll - deep status history intentionally skipped."
      - name: Freeze daily bottleneck photo at 20h Paris
        shell: bash
        run: |
          if [ "$(TZ=Europe/Paris date +%H)" != "20" ]; then
            echo "Outside 20h Paris window - no daily bottleneck freeze."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const password = process.env.FTP_PASSWORD || process.env.SFTP_PASSWORD;
          const base = String(process.env.SUPABASE_URL || '').replace(/\/$/, '');
          if (!password || !base) throw new Error('Missing freeze configuration');
          const token = crypto.createHash('sha256').update(`kpi-crvo-ftp-bridge:v1:${password}`).digest('hex');
          const response = await fetch(`${base}/functions/v1/kpi-ftp-operational-gateway?action=bottleneck-freeze`, {
            method: 'POST',
            headers: { 'x-kpi-bridge-token': token, 'Content-Type': 'application/json' },
            body: '{}',
          });
          const payload = await response.json().catch(() => ({}));
          console.log(JSON.stringify({ event: 'bottleneck_freeze', status: response.status, frozen: payload.frozen, reason: payload.reason, snapshotDate: payload.snapshotDate, sectors: payload.sectors }));
          if (!response.ok) process.exit(1);
          NODE
