name: KPI CRVO - synchronisation FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bridge/**"
      - ".github/workflows/kpi-sftp-sync.yml"
  schedule:
    # Les dépôts opérationnels observés arrivent majoritairement autour de H:00 à H:04.
    # Contrôle à H:05 puis toutes les 15 min sur la plage opérationnelle (cron en UTC).
    # Les doublons sont ignorés par SHA-256 : aucun retraitement si le fichier n'a pas changé.
    - cron: "5,20,35,50 3-21 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bridge
    env:
      FTP_HOST: ${{ secrets.FTP_HOST || secrets.SFTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT || secrets.SFTP_PORT }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.SFTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.SFTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || secrets.SFTP_REMOTE_DIR }}
      FTP_SECURE: ${{ vars.FTP_SECURE || 'false' }}
      FTP_FILE_PATTERN: ${{ vars.FTP_FILE_PATTERN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      KPI_SOURCE_ID: dfbb57cc-8771-4e53-b52b-38defa389b64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run sync
      # Contrôle temporaire sans donnée véhicule : permet de rapprocher les agrégats
      # Factory clôturés du Book avant d'activer le mapping CSV de production.
      - run: node src/factory-diagnostics.mjs
