name: KPI CRVO - synchronisation FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bridge/**"
      - ".github/workflows/kpi-sftp-sync.yml"
  schedule:
    # Plusieurs passages le matin : un fichier déposé après le premier contrôle
    # est repris automatiquement au passage suivant. Les doublons sont ignorés par SHA-256.
    - cron: "30 3,5,7,9 * * 1-5"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run sync
        env:
          # FTP_* est la configuration cible. Les anciens secrets SFTP_* sont
          # gardés en fallback pour permettre la bascule sans ressaisie immédiate.
          FTP_HOST: ${{ secrets.FTP_HOST || secrets.SFTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT || secrets.SFTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.SFTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || secrets.SFTP_REMOTE_DIR }}
          FTP_SECURE: ${{ vars.FTP_SECURE || 'false' }}
          FTP_FILE_PATTERN: ${{ vars.FTP_FILE_PATTERN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KPI_SOURCE_ID: dfbb57cc-8771-4e53-b52b-38defa389b64
