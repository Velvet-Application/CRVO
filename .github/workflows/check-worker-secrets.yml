name: Check CRVO Worker secret names

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-worker-secrets.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: List secret names only
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kpi-crvo/secrets")
          node -e 'const d=JSON.parse(process.argv[1]); if(!d.success) process.exit(2); console.log((d.result||[]).map(x=>x.name).sort().join("\n"));' "$response"
