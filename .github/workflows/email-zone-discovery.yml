name: Discover CRVO email zone

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/email-zone-discovery.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: List Cloudflare zones
        run: |
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account) throw new Error('Cloudflare credentials unavailable');
          const response=await fetch(`https://api.cloudflare.com/client/v4/zones?account.id=${account}&per_page=50`,{headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'}});
          const payload=await response.json();
          if(!response.ok||payload.success!==true){console.log(JSON.stringify({status:response.status,errors:payload.errors??[]}));process.exit(2);}
          console.log(JSON.stringify({zones:(payload.result??[]).map(z=>({name:z.name,status:z.status,id:z.id}))}));
          NODE
