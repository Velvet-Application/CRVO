name: Deploy CRVO to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "public/**"
      - "worker/**"
      - "scripts/**"
      - "proxy.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: crvo-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build, deploy and verify production
        run: npm run build
      - name: Verify protected production health
        run: |
          node <<'NODE'
          const origin = "https://kpi-crvo.cyril-gay.workers.dev";
          const stamp = Date.now();
          const [healthResponse, protectedResponse] = await Promise.all([
            fetch(`${origin}/api/health?_=${stamp}`, { headers: { "Cache-Control": "no-cache" } }),
            fetch(`${origin}/api/bottlenecks?_=${stamp}`, { headers: { "Cache-Control": "no-cache" } }),
          ]);
          const health = await healthResponse.json().catch(() => ({}));
          console.log(`health=${healthResponse.status} ok=${health.ok} data=${health.dataReady} bottlenecks=${health.bottlenecksReady} clients=${health.clientDashboardReady} protected=${protectedResponse.status}`);
          if (!healthResponse.ok || health.ok !== true || health.dataReady !== true || health.bottlenecksReady !== true || health.clientDashboardReady !== true) process.exit(1);
          if (protectedResponse.status !== 401) process.exit(2);
          NODE
