name: Deploy CRVO to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "public/**"
      - "worker/**"
      - "scripts/**"
      - "proxy.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: crvo-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build, deploy and verify production
        run: npm run build
      - name: Verify protected production health
        run: |
          node <<'NODE'
          const origin = "https://kpi-crvo.cyril-gay.workers.dev";
          const stamp = Date.now();
          const [healthResponse, protectedResponse, financeResponse] = await Promise.all([
            fetch(`${origin}/api/health?_=${stamp}`, { headers: { "Cache-Control": "no-cache" } }),
            fetch(`${origin}/api/bottlenecks?_=${stamp}`, { headers: { "Cache-Control": "no-cache" } }),
            fetch(`${origin}/api/kiosk/direction?resource=finance&history=1&_=${stamp}`, { headers: { "Cache-Control": "no-cache" } }),
          ]);
          const health = await healthResponse.json().catch(() => ({}));
          const finance = await financeResponse.json().catch(() => ({}));
          const revenue = Number(finance?.snapshot?.metrics?.revenue_cumulative || 0);
          const budget = Number(finance?.snapshot?.metrics?.revenue_cumulative_target || finance?.budget || 0);
          const pending = finance?.pendingInvoices;
          const pendingCount = Number(pending?.count ?? -1);
          const pendingRevenue = Number(pending?.revenue ?? -1);
          const overdueCount = Number(pending?.overdueCount ?? -1);
          console.log(`health=${healthResponse.status} ok=${health.ok} data=${health.dataReady} bottlenecks=${health.bottlenecksReady} clients=${health.clientDashboardReady} protected=${protectedResponse.status} finance=${financeResponse.status} connected=${finance.connected} asOf=${finance.asOfDate} revenue=${revenue} budget=${budget} pending=${pendingCount} pendingCA=${pendingRevenue} overdue=${overdueCount} workload=${pending?.workloadDate} park=${pending?.parkDate}`);
          if (!healthResponse.ok || health.ok !== true || health.dataReady !== true || health.bottlenecksReady !== true || health.clientDashboardReady !== true) process.exit(1);
          if (protectedResponse.status !== 401) process.exit(2);
          if (!financeResponse.ok || finance.connected !== true || !finance.snapshot || revenue <= 0 || budget <= 0) process.exit(3);
          if (!pending || pendingCount < 0 || pendingRevenue < 0 || overdueCount < 0 || !pending.workloadDate || !pending.parkDate) process.exit(4);
          NODE
