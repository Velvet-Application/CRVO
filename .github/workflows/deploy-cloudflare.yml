name: Deploy ToolBox CRVO to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "public/**"
      - "worker/**"
      - "scripts/build-verified.sh"
      - "scripts/sites-env.sh"
      - "scripts/validate-artifact.sh"
      - "proxy.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: crvo-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build, deploy and verify production
        run: npm run build
      - name: Verify industrial production health and confidentiality
        run: |
          node <<'NODE'
          const origin="https://kpi-crvo.cyril-gay.workers.dev";
          const stamp=Date.now();
          const [healthResponse,protectedResponse,directionFinanceResponse,directionObjectivesResponse,atelierResponse,manifestResponse,workerResponse,iconResponse]=await Promise.all([
            fetch(`${origin}/api/health?_=${stamp}`,{headers:{"Cache-Control":"no-cache"}}),
            fetch(`${origin}/api/bottlenecks?_=${stamp}`,{headers:{"Cache-Control":"no-cache"}}),
            fetch(`${origin}/api/kiosk/direction?resource=finance&_=${stamp}`,{headers:{"Cache-Control":"no-cache"},redirect:"manual"}),
            fetch(`${origin}/api/kiosk/direction?resource=objectives&_=${stamp}`,{headers:{"Cache-Control":"no-cache"},redirect:"manual"}),
            fetch(`${origin}/api/kiosk/atelier?resource=dashboard&_=${stamp}`,{headers:{"Cache-Control":"no-cache"},redirect:"manual"}),
            fetch(`${origin}/manifest.webmanifest?_=${stamp}`,{headers:{"Cache-Control":"no-cache"}}),
            fetch(`${origin}/sw.js?_=${stamp}`,{headers:{"Cache-Control":"no-cache"}}),
            fetch(`${origin}/pwa-icon.svg?_=${stamp}`,{headers:{"Cache-Control":"no-cache"}}),
          ]);
          const health=await healthResponse.json().catch(()=>({}));
          const manifest=await manifestResponse.json().catch(()=>({}));
          const workerText=await workerResponse.text().catch(()=>"");
          console.log(`health=${healthResponse.status} ok=${health.ok} trust=${health.trustLevel} dataTrustOk=${health.dataTrustOk} data=${health.dataReady} bottlenecks=${health.bottlenecksReady} clients=${health.clientDashboardReady} financeReady=${health.financeReady} objectiveReady=${health.objectiveReady} ftpAge=${health?.ftp?.syncAgeMinutes} sourceAge=${health?.production?.sourceAgeMinutes} protected=${protectedResponse.status} kioskFinanceAnon=${directionFinanceResponse.status} kioskObjectivesAnon=${directionObjectivesResponse.status} kioskAtelierAnon=${atelierResponse.status} pwaManifest=${manifestResponse.status} sw=${workerResponse.status} icon=${iconResponse.status} display=${manifest.display}`);
          if(!healthResponse.ok||health.ok!==true||health.dataReady!==true||health.bottlenecksReady!==true||health.clientDashboardReady!==true||health.financeReady!==true||health.objectiveReady!==true)process.exit(1);
          if(health.dataTrustOk===false||health.trustLevel==="red")process.exit(9);
          if(protectedResponse.status!==401)process.exit(2);
          if(directionFinanceResponse.status!==401||directionObjectivesResponse.status!==401||!atelierResponse.ok)process.exit(10);
          if("financeHealth" in health||"revenue" in health||"budget" in health)process.exit(11);
          if(!manifestResponse.ok||manifest.name!=="ToolBox CRVO Lens"||manifest.display!=="standalone"||manifest.start_url!=="/"||!Array.isArray(manifest.icons)||manifest.icons.length<1)process.exit(6);
          if(!workerResponse.ok||!workerText.includes("serviceWorker")&&!workerText.includes("addEventListener"))process.exit(7);
          if(!iconResponse.ok)process.exit(8);
          NODE
