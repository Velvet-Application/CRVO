name: Diagnose CRVO live browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-live-browser.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Inspect production dashboard in a real browser
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const api = [];
          page.on('console', msg => console.log('BROWSER_CONSOLE', msg.type(), msg.text()));
          page.on('pageerror', err => console.log('BROWSER_PAGEERROR', err.message));
          page.on('response', async response => {
            if (response.url().includes('/api/dashboard')) {
              let body = '';
              try { body = await response.text(); } catch {}
              api.push({ status: response.status(), url: response.url(), body: body.slice(0, 1200) });
            }
          });
          const started = Date.now();
          const response = await page.goto('https://kpi-crvo.cyril-gay.workers.dev/?diag=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 60000 });
          console.log('PAGE_STATUS', response?.status(), 'DOMCONTENTLOADED_MS', Date.now() - started);
          await page.waitForTimeout(12000);
          const state = await page.evaluate(() => ({
            readyState: document.readyState,
            topbarDate: document.querySelector('.topbar-date strong')?.textContent,
            freshness: document.querySelector('.freshness strong')?.textContent,
            hero: Array.from(document.querySelectorAll('.day-hero-stats > div strong')).map(el => el.textContent),
            production: Array.from(document.querySelectorAll('.performance-board:not(.cumulative-board) .performance-column')).map(col => ({ name: col.querySelector('h3')?.textContent, value: col.querySelector('.performance-main strong')?.textContent })),
            range: Array.from(document.querySelectorAll('.cumulative-board input[type=date]')).map(input => input.value),
            liveDataset: document.documentElement.dataset.crvoLive || null,
            scripts: Array.from(document.scripts).map(s => s.src).filter(Boolean).slice(-10),
          }));
          console.log('DOM_STATE', JSON.stringify(state));
          console.log('API_RESPONSES', JSON.stringify(api));
          await browser.close();
          if (!String(state.topbarDate || '').includes('13')) process.exitCode = 2;
          NODE
