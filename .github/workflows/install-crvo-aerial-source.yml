name: Install exact CRVO aerial source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-crvo-aerial-source.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download original user-provided aerial source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://at.adobe.com/m0iiykQzfGDE7LcV' -o public/crvo-lens-aerial-source.jpeg
          test -s public/crvo-lens-aerial-source.jpeg
          file public/crvo-lens-aerial-source.jpeg
      - name: Commit original source asset
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/crvo-lens-aerial-source.jpeg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(production): install original CRVO aerial source'
          git push origin HEAD:main
