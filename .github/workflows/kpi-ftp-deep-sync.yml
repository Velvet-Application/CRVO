name: KPI CRVO - enrichissement FTP horaire

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bridge/src/operational-live-sync.mjs"
      - ".github/workflows/kpi-ftp-deep-sync.yml"
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: read

concurrency:
  group: kpi-crvo-ftp-deep
  cancel-in-progress: true

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bridge
    env:
      FTP_HOST: ${{ secrets.FTP_HOST || secrets.SFTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT || secrets.SFTP_PORT }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.SFTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.SFTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || secrets.SFTP_REMOTE_DIR }}
      FTP_SECURE: ${{ vars.FTP_SECURE || 'false' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      KPI_SOURCE_ID: dfbb57cc-8771-4e53-b52b-38defa389b64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Refresh operational history and bottleneck detail
        run: node src/operational-live-sync.mjs
