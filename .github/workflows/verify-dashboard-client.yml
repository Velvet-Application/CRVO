name: Verify Dashboard client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/api/health/**"
      - "proxy.ts"
      - ".github/workflows/verify-dashboard-client.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify client dashboard data and protection
        run: |
          node <<'NODE'
          const origin = "https://kpi-crvo.cyril-gay.workers.dev";
          const stamp = Date.now();
          const [healthResponse, clientResponse] = await Promise.all([
            fetch(`${origin}/api/health?_=${stamp}`, { headers: { "Cache-Control": "no-cache" } }),
            fetch(`${origin}/api/client-dashboard?_=${stamp}`, { headers: { "Cache-Control": "no-cache" } }),
          ]);
          const health = await healthResponse.json().catch(() => ({}));
          console.log(`health=${healthResponse.status} clientsReady=${health.clientDashboardReady} clientProtected=${clientResponse.status}`);
          if (!healthResponse.ok || health.ok !== true || health.clientDashboardReady !== true) process.exit(1);
          if (clientResponse.status !== 401) process.exit(2);
          NODE
