name: Patch atelier live label

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-atelier-line.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch atelier
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/atelier/page.tsx')
          s=p.read_text()
          s=s.replace('setConnected(Boolean(dashboard.connected && objectivePayload.connected));','setConnected(Boolean(dashboard.connected));')
          s=s.replace('const refreshTimer = window.setInterval(() => void refresh(), 20000);','const refreshTimer = window.setInterval(() => void refresh(), 60000);')
          s=s.replace('{connected ? "FTP / SUPABASE CONNECTÉ" : "MODE SECOURS"}','{connected ? "FTP LIVE CONNECTÉ" : "DERNIÈRE DONNÉE DISPONIBLE"}')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/atelier/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Show atelier as live FTP and poll once per minute"
          git push
