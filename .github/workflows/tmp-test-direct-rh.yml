name: Temporary direct RH smoke test
on:
  push:
    paths:
      - '.github/workflows/tmp-test-direct-rh.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call direct RH gateway with CSV
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rh.csv <<'EOF'
          date;collaborateur;code_temps;duree
          14/08/2026;TEST DEBUG CI;PRES;7,5
          EOF
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -X POST 'https://tvmkhvfmdstkunwwuzuz.supabase.co/functions/v1/kpi-direct-import-gateway' \
            -H 'x-crvo-ingest-token: fea17aeeda11fb7e5ce3915150bd0ab031802361ea47d1787496ec13d6ac444b' \
            -F 'source=rh' \
            -F 'sender=debug-ci' \
            -F 'messageId=debug-ci-1' \
            -F 'file=@/tmp/rh.csv;type=text/csv')
          echo "HTTP $code"
          cat /tmp/body.txt
          test "$code" = "200"
