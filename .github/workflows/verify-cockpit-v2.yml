name: Verify CRVO COCKPIT V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/intelligence/**"
      - "app/api/cockpit-v2/**"
      - "app/api/health/**"
      - "proxy.ts"
      - ".github/workflows/verify-cockpit-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify authentication and data health
        run: |
          node <<'NODE'
          const origin = "https://kpi-crvo.cyril-gay.workers.dev";
          const stamp = Date.now();
          const [healthResponse, cockpitResponse] = await Promise.all([
            fetch(`${origin}/api/health?_=${stamp}`, { headers: { "Cache-Control": "no-cache" } }),
            fetch(`${origin}/api/cockpit-v2?_=${stamp}`, { headers: { "Cache-Control": "no-cache" } }),
          ]);
          const health = await healthResponse.json().catch(() => ({}));
          console.log(`health=${healthResponse.status} ok=${health.ok} data=${health.dataReady} cockpitProtected=${cockpitResponse.status}`);
          if (!healthResponse.ok || health.ok !== true || health.dataReady !== true || health.bottlenecksReady !== true) process.exit(1);
          if (cockpitResponse.status !== 401) process.exit(2);
          NODE
